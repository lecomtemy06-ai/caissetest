<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1E1E1E">
<title>Caisse Enregistreuse — Friterie de L'Ancienne Gare</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
<div id="app">
  <!-- BARRE HAUTE -->
  <div id="barre-haut">
    <button id="logo-btn" aria-label="Accès gestion des prix">
      <img src="./assets/icons/icon-192.png" alt="">
    </button>
    <!-- Choix obligatoire pour chaque ticket : il détermine le taux de TVA -->
    <div id="zone-mode" role="group" aria-label="Mode de consommation">
      <button id="btn-emporter" class="btn-mode" aria-pressed="false">À emporter</button>
      <button id="btn-surplace" class="btn-mode" aria-pressed="false">Sur place</button>
    </div>
    <div id="ecran-total">0.00 €</div>
    <div id="barre-haut-btns">
      <button id="btn-cloture" class="btn-haut">Clôture</button>
      <button id="btn-historique" class="btn-haut">Historique</button>
      <button id="btn-export" class="btn-haut">Export</button>
      <button id="btn-plein-ecran" class="btn-haut" title="Passer en plein écran">⛶</button>
    </div>
  </div>

  <!-- ZONE CENTRALE -->
  <div id="zone-centrale">
    <!-- GAUCHE : menu de vente -->
    <div id="zone-gauche-container">
      <div id="zone-menu-scroll">
        <div id="zone-menu"></div>
      </div>
      <div id="zone-footer"></div>
    </div>

    <!-- DROITE : panier + calculatrice -->
    <div id="zone-droite">
      <div id="panier-scroll">
        <div id="panier-liste"><div id="panier-vide">Panier vide</div></div>
      </div>
      <div id="panier-total">TOTAL : 0.00 €</div>
      <div id="zone-calc">
        <div id="ecran-calc"></div>
        <div id="grille-calc"></div>
      </div>
    </div>
  </div>

  <!-- BARRE BASSE -->
  <div id="barre-bas">
    <div id="horloge"><span id="h-date"></span><span id="h-heure"></span></div>
    <button id="btn-reset">RESET</button>
    <div id="zone-jaune"></div>
    <button id="btn-paiement">PAIEMENT</button>
  </div>
</div>

<!-- Champ de sélection de fichier pour la restauration de sauvegarde JSON.
     Reste en dehors des fenêtres modales (qui sont recréées à chaque
     ouverture) afin de conserver un id stable référencé par ui-export.js. -->
<input type="file" id="import-json" accept="application/json" style="display:none">

<script type="module" src="./js/app.js"></script>
</body>
</html>
